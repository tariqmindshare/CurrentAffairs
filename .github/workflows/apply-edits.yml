# Applies admin edit requests (data/edits.json) pushed from the website.
#  - deletions are applied mechanically
#  - instructions are applied by Claude Code (needs repo secret ANTHROPIC_API_KEY)
# The site is then rebuilt and committed; GitHub Pages redeploys from main.
name: Apply admin edits

on:
  push:
    branches: [main]
    paths: [data/edits.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-edits
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deletions and rebuild
        run: node tools/apply-edits.mjs

      - name: Count pending instructions
        id: pending
        run: echo "count=$(node tools/apply-edits.mjs --list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')" >> "$GITHUB_OUTPUT"

      - name: Apply instructions with Claude
        if: steps.pending.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set — ${{ steps.pending.outputs.count }} instruction(s) left pending."
            exit 0
          fi
          awk '/^---$/ && n<2 {n++; next} n>=2' .claude/commands/apply-edits.md > /tmp/prompt.md
          npx -y @anthropic-ai/claude-code -p "$(cat /tmp/prompt.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(node tools/apply-edits.mjs:*),Bash(node tools/build.mjs:*)"
          node tools/build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Apply admin edit requests"
          git push
